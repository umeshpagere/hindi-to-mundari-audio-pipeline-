name: mundari_pipeline
description: "Offline Hindi-to-Mundari audio pipeline — Stage 1: Hindi STT via whisper_ggml."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Declared explicitly for use in SttStage
  path_provider: ^2.1.5
  sherpa_onnx: ^1.13.6
  onnxruntime: ^1.4.1
  dart_sentencepiece_tokenizer: ^1.3.2

  record: ^7.1.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    # ASR Stage: IndicConformer (Sherpa-ONNX) — large model pushed directly via ADB
    # - assets/models/asr/model.int8.onnx
    - assets/models/asr/tokens.txt
    - assets/models/tts/mundari_stt_int8/mundari_stt_ctc.int8.onnx
    - assets/models/tts/mundari_stt_int8/vocab.txt

    # Mundari Piper-VITS TTS model + espeak-ng phoneme data
    - assets/models/tts/mundari.onnx
    - assets/models/tts/tokens.txt
    - assets/models/tts/espeak-ng-data/
    - assets/models/tts/espeak-ng-data/voices/
    - assets/models/tts/espeak-ng-data/voices/!v/
    - assets/models/tts/espeak-ng-data/lang/
    - assets/models/tts/espeak-ng-data/lang/aav/
    - assets/models/tts/espeak-ng-data/lang/art/
    - assets/models/tts/espeak-ng-data/lang/azc/
    - assets/models/tts/espeak-ng-data/lang/bat/
    - assets/models/tts/espeak-ng-data/lang/bnt/
    - assets/models/tts/espeak-ng-data/lang/ccs/
    - assets/models/tts/espeak-ng-data/lang/cel/
    - assets/models/tts/espeak-ng-data/lang/cus/
    - assets/models/tts/espeak-ng-data/lang/dra/
    - assets/models/tts/espeak-ng-data/lang/esx/
    - assets/models/tts/espeak-ng-data/lang/gmq/
    - assets/models/tts/espeak-ng-data/lang/gmw/
    - assets/models/tts/espeak-ng-data/lang/grk/
    - assets/models/tts/espeak-ng-data/lang/inc/
    - assets/models/tts/espeak-ng-data/lang/ine/
    - assets/models/tts/espeak-ng-data/lang/ira/
    - assets/models/tts/espeak-ng-data/lang/iro/
    - assets/models/tts/espeak-ng-data/lang/itc/
    - assets/models/tts/espeak-ng-data/lang/jpx/
    - assets/models/tts/espeak-ng-data/lang/map/
    - assets/models/tts/espeak-ng-data/lang/miz/
    - assets/models/tts/espeak-ng-data/lang/myn/
    - assets/models/tts/espeak-ng-data/lang/poz/
    - assets/models/tts/espeak-ng-data/lang/roa/
    - assets/models/tts/espeak-ng-data/lang/sai/
    - assets/models/tts/espeak-ng-data/lang/sem/
    - assets/models/tts/espeak-ng-data/lang/sit/
    - assets/models/tts/espeak-ng-data/lang/tai/
    - assets/models/tts/espeak-ng-data/lang/trk/
    - assets/models/tts/espeak-ng-data/lang/urj/
    - assets/models/tts/espeak-ng-data/lang/zle/
    - assets/models/tts/espeak-ng-data/lang/zls/
    - assets/models/tts/espeak-ng-data/lang/zlw/

    # Stage 2: ONNX Machine Translation models
    - assets/models/mt/model_int8.onnx
    - assets/models/mt/spm.model
    - assets/models/mt/decoder_model_int8_argmax.onnx
    - assets/models/mt/tgt_remap_table.bin
    - assets/models/mt/model.SRC
    - assets/models/mt/model.TGT
    - assets/models/mt/dict.SRC.json
    - assets/models/mt/dict.TGT.json
    - assets/models/mt/tokenizer_custom_tags.json

    # Drop 16 kHz mono WAV test files here for manual testing via the UI.
    - assets/test/
